<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ OpenSquilla 元技能魔法书</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;}
  body{
    font-family:'Songti SC','STKaiti','KaiTi','Microsoft YaHei',serif;
    background:radial-gradient(ellipse at center,#0a0a2a 0%,#02020f 100%);
    color:#e8e8ff;
    display:flex;align-items:center;justify-content:center;
    flex-direction:column;
    perspective:2400px;
  }
  #stars{position:fixed;inset:0;pointer-events:none;z-index:0;}
  .star{position:absolute;background:#fff;border-radius:50%;animation:twinkle 3s infinite ease-in-out;}
  @keyframes twinkle{0%,100%{opacity:.2;}50%{opacity:.9;}}

  /* ===== 封面 ===== */
  .cover-screen{
    position:absolute;inset:0;z-index:10;
    display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;gap:20px;
    transition:opacity .8s,transform .8s;
    background:radial-gradient(ellipse at 50% 40%, rgba(100,60,200,.2) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 60%, rgba(155,229,255,.1) 0%, transparent 50%),
                radial-gradient(ellipse at center,#0a0a2a 0%,#02020f 100%);
  }
  .cover-screen.hidden{opacity:0;pointer-events:none;transform:scale(.85);}

  .cover-art{
    position:relative;width:200px;height:200px;margin-bottom:10px;
  }
  .cover-art-inner{
    width:100%;height:100%;
    border-radius:50%;
    background:
      radial-gradient(circle at 32% 25%,rgba(255,255,255,.95) 0%,rgba(255,255,255,.38) 8%,transparent 24%),
      radial-gradient(circle at 50% 54%,rgba(155,229,255,.82) 0%,rgba(195,155,255,.72) 38%,rgba(90,45,190,.9) 72%,rgba(24,12,82,.95) 100%);
    animation:spinSlow 10s linear infinite;
    box-shadow:0 0 35px rgba(155,229,255,.8),0 0 90px rgba(195,155,255,.55),0 0 150px rgba(90,45,190,.35),inset -20px -24px 38px rgba(15,5,65,.58),inset 18px 16px 28px rgba(255,255,255,.2);
  }
  .cover-ring{
    position:absolute;inset:-12px;border-radius:50%;
    border:2px solid rgba(155,229,255,.2);
    animation:spinSlow 15s linear infinite reverse;
  }
  .cover-ring2{
    position:absolute;inset:-24px;border-radius:50%;
    border:1px dashed rgba(195,155,255,.15);
    animation:spinSlow 20s linear infinite;
  }
  .rune-dots{
    position:absolute;width:100%;height:100%;inset:0;
    animation:spinSlow 8s linear infinite;
  }
  .rune-dot{
    position:absolute;width:6px;height:6px;border-radius:50%;
    background:#9be5ff;box-shadow:0 0 10px #9be5ff;
  }
  .rune-dot:nth-child(1){top:-16px;left:50%;transform:translateX(-50%);}
  .rune-dot:nth-child(2){bottom:-16px;left:50%;transform:translateX(-50%);}
  .rune-dot:nth-child(3){left:-16px;top:50%;transform:translateY(-50%);}
  .rune-dot:nth-child(4){right:-16px;top:50%;transform:translateY(-50%);}
  .rune-dot:nth-child(5){top:-10px;right:20%;}
  .rune-dot:nth-child(6){top:-10px;left:20%;}
  .rune-dot:nth-child(7){bottom:-10px;right:20%;}
  .rune-dot:nth-child(8){bottom:-10px;left:20%;}

  @keyframes spinSlow{from{transform:rotate(0);}to{transform:rotate(360deg);}}
  @keyframes floatGlow{
    0%,100%{transform:translateY(0);filter:drop-shadow(0 0 20px #9be5ff);}
    50%{transform:translateY(-10px);filter:drop-shadow(0 0 40px #c39bff);}
  }

  .cover-title{
    font-size:56px;font-weight:bold;
    background:linear-gradient(135deg,#9be5ff,#c39bff,#ffd86b);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 30px rgba(155,229,255,.3);
    letter-spacing:6px;
    animation:floatGlow 4s infinite ease-in-out;
  }
  .cover-sub{font-size:18px;color:#a8a8d0;letter-spacing:4px;}
  .cover-sub small{font-size:13px;color:#6a6a90;}
  .open-btn{
    margin-top:12px;padding:16px 48px;font-size:19px;
    background:linear-gradient(135deg,rgba(155,229,255,.12),rgba(195,155,255,.12));
    color:#fff;border:2px solid #9be5ff;border-radius:50px;
    cursor:pointer;letter-spacing:6px;
    box-shadow:0 0 30px rgba(155,229,255,.3),inset 0 0 20px rgba(155,229,255,.1);
    transition:all .3s;font-family:inherit;
  }
  .open-btn:hover{transform:scale(1.08);box-shadow:0 0 60px #9be5ff;}

  /* ===== 书本 ===== */
  .book-wrap{
    position:relative;
    width:1800px;max-width:95vw;
    height:900px;max-height:86vh;
    opacity:0;transition:opacity .8s;margin-top:0;
  }
  .book-wrap.show{opacity:1;}
  .book{position:relative;width:100%;height:100%;transform-style:preserve-3d;}
  .page{
    position:absolute;top:0;left:50%;
    width:50%;height:100%;
    transform-origin:left center;
    transform-style:preserve-3d;
    transition:transform 1.1s cubic-bezier(.65,.05,.36,1);
    background:linear-gradient(135deg,#1a1a3a 0%,#0f0f28 100%);
    border:1px solid rgba(155,229,255,.2);
    box-shadow:inset 0 0 60px rgba(0,0,0,.6);
  }
  .page.flipped{transform:rotateY(-180deg);}
  .page-face{
    position:absolute;inset:0;
    backface-visibility:hidden;
    padding:48px 50px;
    overflow-y:auto;
    display:flex;flex-direction:column;
  }
  .page-face::-webkit-scrollbar{width:4px;}
  .page-face::-webkit-scrollbar-track{background:rgba(155,229,255,.05);border-radius:2px;}
  .page-face::-webkit-scrollbar-thumb{background:rgba(155,229,255,.3);border-radius:2px;}
  .page-front{}
  .page-back{transform:rotateY(180deg);}
  .page-front::before{content:'';position:absolute;top:0;bottom:0;left:0;width:30px;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.6),transparent);}
  .page-back::before{content:'';position:absolute;top:0;bottom:0;right:0;width:30px;pointer-events:none;background:linear-gradient(270deg,rgba(0,0,0,.6),transparent);}
  .spine{
    position:absolute;left:50%;top:0;bottom:0;width:4px;
    transform:translateX(-2px);
    background:linear-gradient(to bottom,#9be5ff,#c39bff,#9be5ff);
    box-shadow:0 0 20px #9be5ff;z-index:100;
  }
  .page-num{
    position:absolute;bottom:14px;font-size:12px;color:#6a6a90;letter-spacing:2px;
  }
  .page-front .page-num{right:24px;}
  .page-back .page-num{left:24px;}

  /* ===== 导航栏 ===== */
  .nav-bar{
    display:flex;align-items:center;justify-content:center;
    gap:18px;margin-top:14px;z-index:50;
    opacity:0;transition:opacity .8s;transition-delay:.3s;
    width:1800px;max-width:95vw;
  }
  .nav-bar.show{opacity:1;}
  .nav-btn{
    padding:10px 24px;font-size:15px;
    background:rgba(155,229,255,.08);
    color:#9be5ff;border:1px solid rgba(155,229,255,.3);border-radius:20px;
    cursor:pointer;letter-spacing:2px;
    transition:all .3s;font-family:inherit;white-space:nowrap;
  }
  .nav-btn:hover{background:rgba(155,229,255,.2);box-shadow:0 0 15px rgba(155,229,255,.3);}
  .nav-btn:disabled{opacity:.25;cursor:not-allowed;}
  .page-indicator{font-size:14px;color:#a8a8d0;letter-spacing:1px;white-space:nowrap;min-width:68px;text-align:center;}
  /* 进度条滑块 */
  .slider-wrap{flex:1;display:flex;align-items:center;gap:10px;max-width:460px;}
  .slider-wrap label{font-size:11px;color:#6a6a90;white-space:nowrap;}
  .slider{
    -webkit-appearance:none;appearance:none;
    flex:1;height:4px;border-radius:2px;
    background:linear-gradient(90deg,rgba(155,229,255,.15),rgba(195,155,255,.15));
    outline:none;cursor:pointer;
  }
  .slider::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:16px;height:16px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%, #9be5ff, #6ab8ff);
    box-shadow:0 0 12px rgba(155,229,255,.5);
    cursor:pointer;border:2px solid rgba(255,255,255,.2);
  }
  .slider::-moz-range-thumb{
    width:16px;height:16px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%, #9be5ff, #6ab8ff);
    box-shadow:0 0 12px rgba(155,229,255,.5);
    cursor:pointer;border:2px solid rgba(255,255,255,.2);
  }

  /* ===== 技能页样式 ===== */
  .skill-header{display:flex;align-items:center;gap:18px;margin-bottom:18px;flex-shrink:0;}
  .skill-icon{font-size:56px;filter:drop-shadow(0 0 12px currentColor);animation:floatGlow 3s infinite ease-in-out;flex-shrink:0;}
  .skill-info{flex:1;min-width:0;}
  .skill-name{
    font-size:32px;font-weight:bold;
    background:linear-gradient(135deg,#9be5ff,#c39bff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .skill-cn{font-size:15px;color:#a8a8d0;letter-spacing:3px;}
  .skill-desc{
    font-size:18px;line-height:1.9;color:#d8d8f0;
    padding:18px 20px;border-left:4px solid #9be5ff;
    background:rgba(155,229,255,.04);border-radius:0 6px 6px 0;
    margin-bottom:16px;flex-shrink:0;
  }
  .skill-spell{
    font-size:17px;color:#ffd86b;padding:15px 18px;
    background:rgba(255,216,107,.04);
    border:1px dashed rgba(255,216,107,.35);border-radius:6px;
    font-style:italic;line-height:1.7;flex-shrink:0;
  }
  .skill-forbidden{
    font-size:16px;color:#ff6b9b;padding:14px 18px;margin-top:12px;
    background:rgba(255,107,155,.05);
    border:1px solid rgba(255,107,155,.2);border-radius:6px;
    line-height:1.5;flex-shrink:0;
  }
  .skill-page-layout{height:100%;display:flex;flex-direction:column;padding-bottom:42px;}
  .skill-left-layout .mechanism-block{
    margin-top:auto;padding:15px 17px;
    background:rgba(195,155,255,.035);
    border:1px solid rgba(195,155,255,.13);border-radius:6px;
  }
  .skill-left-layout .mechanism-text{font-size:16px;line-height:1.7;}
  .skill-right-layout .energy-section{margin-top:8px;}
  .skill-right-layout .energy-bar{margin-bottom:13px;}
  .skill-right-layout .energy-track{height:9px;}
  .skill-right-layout .io-block{margin-top:24px;padding:15px 18px;}
  .skill-right-layout .io-row{font-size:16px;line-height:1.8;}
  .skill-right-layout .skill-forbidden{margin-top:auto;margin-bottom:8px;}

  /* 能量条 - 右页 */
  .energy-section{margin-top:2px;flex-shrink:0;}
  .section-title{
    font-size:20px;color:#9be5ff;margin-bottom:14px;
    letter-spacing:2px;display:flex;align-items:center;gap:8px;
  }
  .section-title::before,.section-title::after{
    content:'';flex:1;height:1px;
    background:linear-gradient(90deg,transparent,#9be5ff,transparent);
  }
  .energy-bar{margin-bottom:5px;}
  .energy-label{
    display:flex;justify-content:space-between;
    font-size:15px;color:#c8c8e8;margin-bottom:4px;
  }
  .energy-track{
    height:6px;background:rgba(255,255,255,.05);
    border-radius:4px;overflow:hidden;position:relative;
    border:1px solid rgba(155,229,255,.15);
  }
  .energy-fill{
    height:100%;border-radius:4px;
    background:linear-gradient(90deg,#9be5ff,#c39bff);
    box-shadow:0 0 8px #9be5ff;
    width:0;transition:width 1.5s ease-out;
  }
  .io-block{
    margin-top:7px;padding:7px 10px;
    background:rgba(195,155,255,.04);
    border:1px solid rgba(195,155,255,.15);
    border-radius:6px;flex-shrink:0;
  }
  .io-row{font-size:12px;line-height:1.55;color:#d8d8f0;}
  .io-row b{color:#ffd86b;margin-right:6px;}
  .mechanism-block{
    margin-top:7px;padding:8px 10px;
    background:rgba(107,255,184,.035);
    border:1px solid rgba(107,255,184,.16);
    border-radius:6px;flex-shrink:0;
  }
  .mechanism-title{font-size:16px;color:#6bffb8;font-weight:bold;margin-bottom:7px;letter-spacing:2px;}
  .mechanism-text{font-size:12px;line-height:1.55;color:#d8d8f0;}
  .ingredient-block{margin-top:14px;flex-shrink:0;}
  .ingredient-title{font-size:12px;color:#c39bff;font-weight:bold;margin-bottom:6px;letter-spacing:1px;}
  .ingredient-flow{display:flex;align-items:center;flex-wrap:wrap;gap:7px 5px;}
  .ingredient{
    padding:6px 10px;border-radius:5px;font-size:12px;line-height:1.3;color:#e6ddff;
    background:linear-gradient(135deg,rgba(195,155,255,.15),rgba(155,229,255,.06));
    border:1px solid rgba(195,155,255,.28);box-shadow:0 0 8px rgba(195,155,255,.08);
  }
  .ingredient-arrow{font-size:14px;color:#9be5ff;text-shadow:0 0 8px rgba(155,229,255,.8);}

  @media (max-width:1100px), (max-height:820px){
    .page-face{padding:32px 36px;}
    .skill-header{gap:14px;margin-bottom:14px;}
    .skill-icon{font-size:44px;}
    .skill-name{font-size:24px;}
    .skill-cn{font-size:13px;letter-spacing:2px;}
    .skill-desc{font-size:15px;line-height:1.8;padding:14px 16px;margin-bottom:12px;border-left-width:3px;}
    .skill-spell{font-size:14px;padding:12px 14px;line-height:1.6;}
    .skill-forbidden{font-size:13px;padding:12px 14px;}
    .skill-page-layout{padding-bottom:34px;}
    .skill-left-layout .mechanism-block{padding:12px 13px;}
    .skill-left-layout .mechanism-text{font-size:13px;line-height:1.65;}
    .skill-right-layout .energy-bar{margin-bottom:10px;}
    .skill-right-layout .energy-track{height:8px;}
    .skill-right-layout .io-block{margin-top:20px;padding:12px 14px;}
    .skill-right-layout .io-row{font-size:13px;line-height:1.75;}
    .section-title{font-size:15px;margin-bottom:8px;}
    .energy-label{font-size:12px;margin-bottom:3px;}
    .mechanism-title{font-size:12px;margin-bottom:4px;letter-spacing:1px;}
    .ingredient-block{margin-top:11px;}
    .ingredient-flow{gap:5px 4px;}
    .ingredient{padding:5px 8px;font-size:10px;}
    .ingredient-arrow{font-size:11px;}
  }

  /* TOC */
  .toc-title{
    font-size:24px;text-align:center;margin-bottom:16px;
    background:linear-gradient(135deg,#9be5ff,#c39bff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    letter-spacing:4px;flex-shrink:0;
  }
  .toc-list{display:flex;flex-direction:column;gap:5px;flex:1;overflow-y:auto;padding-right:4px;}
  .toc-item{
    display:flex;align-items:center;gap:10px;
    padding:7px 12px;font-size:13px;
    background:rgba(155,229,255,.03);
    border:1px solid rgba(155,229,255,.12);
    border-radius:5px;color:#d8d8f0;
    cursor:pointer;transition:all .2s;flex-shrink:0;
  }
  .toc-item:hover{background:rgba(155,229,255,.12);transform:translateX(3px);}
  .toc-icon{font-size:20px;}
  .toc-name{flex:1;}
  .toc-pg{color:#9be5ff;font-size:11px;}

  /* 测试页 */
  .quiz-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;}
  .quiz-title{
    font-size:22px;text-align:center;margin-bottom:10px;
    background:linear-gradient(135deg,#ffd86b,#ff9bd6);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    letter-spacing:3px;flex-shrink:0;
  }
  .quiz-scroll{flex:1;overflow-y:auto;padding-right:4px;}
  .quiz-scroll::-webkit-scrollbar{width:4px;}
  .quiz-scroll::-webkit-scrollbar-track{background:rgba(155,229,255,.05);border-radius:2px;}
  .quiz-scroll::-webkit-scrollbar-thumb{background:rgba(155,229,255,.3);border-radius:2px;}
  .quiz-q{
    font-size:14px;color:#e8e8ff;margin-bottom:10px;
    padding:10px 12px;background:rgba(255,255,255,.03);
    border-radius:6px;
  }
  .quiz-q-text{margin-bottom:6px;color:#9be5ff;font-size:15px;font-weight:bold;}
  .quiz-opt{
    display:block;padding:6px 12px;margin:4px 0;font-size:13px;
    background:rgba(155,229,255,.04);
    border:1px solid rgba(155,229,255,.16);
    border-radius:16px;cursor:pointer;
    transition:all .2s;color:#d8d8f0;
    font-family:inherit;text-align:left;width:100%;
  }
  .quiz-opt:hover{background:rgba(155,229,255,.12);}
  .quiz-opt.selected{
    background:linear-gradient(135deg,rgba(155,229,255,.25),rgba(195,155,255,.25));
    border-color:#9be5ff;
    box-shadow:0 0 10px rgba(155,229,255,.3);
    color:#fff;
  }
  .cast-btn{
    margin-top:8px;width:100%;padding:10px;
    font-size:14px;letter-spacing:3px;
    background:linear-gradient(135deg,#9be5ff,#c39bff);
    color:#0a0a2a;border:none;border-radius:20px;
    cursor:pointer;font-weight:bold;font-family:inherit;
    transition:all .3s;flex-shrink:0;
  }
  .cast-btn:hover{transform:scale(1.02);box-shadow:0 0 20px #9be5ff;}
  .cast-btn:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none;}

  /* 揭示区（右） */
  .reveal-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;}
  .reveal{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;gap:10px;padding:10px 0;
  }
  .reveal-icon{font-size:72px;animation:floatGlow 2s infinite;}
  .reveal-name{
    font-size:26px;
    background:linear-gradient(135deg,#ffd86b,#9be5ff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    letter-spacing:3px;
  }
  .reveal-desc{font-size:14px;color:#d8d8f0;line-height:1.7;padding:0 10px;}
  .reveal-spell{font-size:13px;color:#ffd86b;padding:10px 14px;background:rgba(255,216,107,.04);border:1px dashed rgba(255,216,107,.3);border-radius:6px;font-style:italic;line-height:1.5;max-width:90%;}
  .reveal-hint{font-size:12px;color:#a8a8d0;font-style:italic;}
  .reveal-empty{color:#6a6a90;font-size:14px;letter-spacing:2px;line-height:1.8;}
  .biu{
    position:absolute;inset:0;pointer-events:none;
    display:flex;align-items:center;justify-content:center;
    opacity:0;z-index:5;
  }
  .biu.flash{animation:biuFlash 1.2s ease-out;}
  @keyframes biuFlash{
    0%{opacity:0;transform:scale(.3);}
    30%{opacity:1;transform:scale(1.4);filter:drop-shadow(0 0 50px #fff);}
    100%{opacity:0;transform:scale(2.5);}
  }

  /* 封底 */
  .back-title{
    font-size:22px;text-align:center;margin-bottom:12px;
    color:#ff6b9b;letter-spacing:3px;
    text-shadow:0 0 15px rgba(255,107,155,.4);flex-shrink:0;
  }
  .back-scroll{flex:1;overflow-y:auto;padding-right:4px;}
  .back-scroll::-webkit-scrollbar{width:4px;}
  .back-scroll::-webkit-scrollbar-thumb{background:rgba(255,107,155,.3);border-radius:2px;}
  .forbidden-item{
    padding:10px 12px;margin:6px 0;font-size:13px;
    background:rgba(255,107,155,.05);
    border-left:3px solid #ff6b9b;border-radius:0 5px 5px 0;
    color:#e8e8ff;line-height:1.5;flex-shrink:0;
  }
  .forbidden-item b{color:#ff6b9b;}
  .end-mark{
    text-align:center;font-size:16px;color:#9be5ff;
    letter-spacing:4px;margin-top:auto;padding:14px 0;
    animation:floatGlow 3s infinite;flex-shrink:0;
  }
</style>
</head>
<body>

<div id="stars"></div>

<!-- ===== 封面 ===== -->
<div class="cover-screen" id="cover">
  <div class="cover-art">
    <div class="cover-ring2"></div>
    <div class="cover-ring"></div>
    <div class="rune-dots">
      <div class="rune-dot"></div><div class="rune-dot"></div>
      <div class="rune-dot"></div><div class="rune-dot"></div>
      <div class="rune-dot"></div><div class="rune-dot"></div>
      <div class="rune-dot"></div><div class="rune-dot"></div>
    </div>
    <div class="cover-art-inner"></div>
  </div>
  <div class="cover-title">元技能魔法书</div>
  <div class="cover-sub">
    OpenSquilla · Meta-Skill Grimoire<br>
    <small>—— 孩子的第一本 AI 咒语指南 ——</small>
  </div>
  <button class="open-btn" onclick="openBook()">📖 翻开魔法书</button>
</div>

<!-- ===== 书 + 导航 ===== -->
<div class="book-wrap" id="bookWrap">
  <div class="book" id="book"></div>
  <div class="spine"></div>
</div>
<div class="nav-bar" id="navBar">
  <button class="nav-btn" id="prevBtn" onclick="flipPrev()">◀ 上一页</button>
  <div class="slider-wrap">

function renderPage(data,pageNum){

      </div>
      <div class="skill-forbidden">⚠️ ${s.forbidden}</div>
    </div>${pg}`;

// ===== 翻页 =====
let currentSpread=1;

function updatePages(){
  sheets.forEach((sh,i)=>{
    if(i<currentSpread){
      sh.classList.add('flipped');
      sh.style.zIndex=i+1;
    }else{
      sh.classList.remove('flipped');
      sh.style.zIndex=sheets.length-i;
    }
  });
  document.getElementById('pageIndicator').textContent=`${currentSpread+1} / ${sheets.length}`;
  document.getElementById('prevBtn').disabled=currentSpread===1;
  document.getElementById('nextBtn').disabled=currentSpread>=sheets.length-1;
  slider.value=currentSpread;
  // 触发能量条动画
  setTimeout(()=>{
    const visiblePages=[currentSpread*2,currentSpread*2+1];
    visiblePages.forEach(pn=>{
      const idx=Math.floor(pn/2);
      const isBack=pn%2===1;
      if(!sheets[idx])return;
      const face=sheets[idx].querySelector(isBack?'.page-back':'.page-front');
      if(!face)return;
      face.querySelectorAll('.energy-fill').forEach(el=>{
        el.style.width=el.dataset.w+'%';
      });
    });
  },400);
}

function flipNext(){if(currentSpread<sheets.length-1){currentSpread++;updatePages();}}
function flipPrev(){if(currentSpread>1){currentSpread--;updatePages();}}
function jumpTo(pageNum){
  currentSpread=Math.ceil(pageNum/2);
  updatePages();
}
function sliderChange(val){
  currentSpread=parseInt(val);
  updatePages();
}

  document.getElementById('cover').classList.add('hidden');
  document.getElementById('bookWrap').classList.add('show');
  document.getElementById('navBar').classList.add('show');
  updatePages();
}

  btn.classList.add('selected');
  picks[qi]=oi;
  if(Object.keys(picks).length===quizQs.length){
    document.getElementById('castBtn').disabled=false;
  }
}
function castSpell(){
  const finalKey=quizQs[0].opts[picks[0]].skill;
  const sk=skills.find(s=>s.id===finalKey);
  // 闪光特效
  const biu=document.getElementById('biu');
  biu.classList.remove('flash');void biu.offsetWidth;biu.classList.add('flash');
  setTimeout(()=>{
    const reveal=document.getElementById('reveal');
    reveal.innerHTML=`
      <div class="reveal-icon" style="color:${sk.color}">${sk.icon}</div>
      <div class="reveal-name">${sk.name}</div>
      <div class="reveal-desc">${sk.desc}</div>
      <div class="reveal-spell">${sk.spell}</div>
      <div class="reveal-hint">✨ 想再测一次？点左边选项重新选吧 ✨</div>`;
  },600);
}

// ===== 键盘翻页 =====
document.addEventListener('keydown',e=>{
  if(document.getElementById('cover').classList.contains('hidden')){
    if(e.key==='ArrowRight')flipNext();
    if(e.key==='ArrowLeft')flipPrev();
  }
});
</script>
</body>
</html>
